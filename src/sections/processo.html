<!-- por dentro: fotos da casa num trilho que anda de lado com a rolagem vertical (motion/trilho.js) -->
<section class="processo" id="processo" aria-label="Por dentro da Máfia" data-trilho>
  <div class="processo__palco">
    <div class="processo__trilho" data-trilho-faixa>
      <div class="processo__abre" data-revela-grupo>
        <h2 class="linhas">
          <span class="linha"><span data-revela>Por dentro</span></span>
          <span class="linha"><span data-revela>da Máfia</span></span>
        </h2>
        <p class="linhas">
          <span class="linha"><span data-revela>Entre para a família.</span></span>
          <span class="linha"><span data-revela>Ninguém sai sem ficha.</span></span>
        </p>
      </div>
      <figure class="passo">
        <div class="passo__foto"><img src="/img/casa-tanques.webp" alt="Corredor dos tanques de fermentação de inox" width="640" height="960" loading="lazy" decoding="async" /></div>
        <figcaption><b>Produção própria</b><span>Os tanques ficam a poucos passos do balcão.</span></figcaption>
      </figure>
      <figure class="passo">
        <div class="passo__foto"><img src="/img/casa-copo.webp" alt="Copo de chopp com a logo da Máfia entre luzinhas" width="640" height="960" loading="lazy" decoding="async" /></div>
        <figcaption><b>O copo da casa</b><span>Gelado, cheio e carimbado com o brasão.</span></figcaption>
      </figure>
      <figure class="passo">
        <div class="passo__foto"><img src="/img/casa-quadros.webp" alt="Quadros antigos de protestos da Lei Seca na parede" width="640" height="960" loading="lazy" decoding="async" /></div>
        <figcaption><b>O esconderijo</b><span>Paredes com a memória dos tempos da Lei Seca.</span></figcaption>
      </figure>
      <figure class="passo">
        <div class="passo__foto"><img src="/img/casa-mural.webp" alt="Mural de investigação com fotos dos clientes e linhas vermelhas" width="640" height="960" loading="lazy" decoding="async" /></div>
        <figcaption><b>Os fichados</b><span>Cliente que volta ganha lugar no mural.</span></figcaption>
      </figure>
      <figure class="passo">
        <div class="passo__foto"><img src="/img/casa-bone.webp" alt="Boné marrom com o brasão da Máfia do Lúpulo" width="640" height="960" loading="lazy" decoding="async" /></div>
        <figcaption><b>Canecas e bonés</b><span>A linha de gifts da Máfia, para levar a família para casa.</span></figcaption>
      </figure>
    </div>
  </div>
</section>
