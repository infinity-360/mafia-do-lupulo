<!-- os copos (no lugar das latas da Akari): três chopps da casa saindo do escuro, lado a lado.
     Hover/foco num copo apaga os outros e acende o nome; o clique deixa o escolhido marcado (motion/copos.js). -->
<section class="copos" id="copos" aria-labelledby="copos-titulo" data-revela-grupo>
  <div class="copos__topo">
    <p class="copos__sobre linha"><span data-revela>A seleção Máfia</span></p>
    <h2 id="copos-titulo" class="copos__titulo linhas">
      <span class="linha"><span data-revela>Do tanque</span></span>
      <span class="linha"><span data-revela>direto pro copo</span></span>
    </h2>
  </div>

  <div class="copos__fila" data-copos>
    <button class="copo" type="button" aria-pressed="false">
      <span class="copo__foto"><img src="/img/copo-clara.webp" alt="Copo de chopp claro com a logo da Máfia do Lúpulo" width="600" height="800" loading="lazy" decoding="async" /></span>
      <span class="copo__nome linha"><span data-revela>Clara</span></span>
      <span class="copo__estilo linha"><span data-revela>Leve, gelada, de balcão</span></span>
    </button>
    <button class="copo" type="button" aria-pressed="false">
      <span class="copo__foto"><img src="/img/copo-grenadine.webp" alt="Copo de chopp Grenadine, vermelho, com a logo da Máfia do Lúpulo" width="600" height="800" loading="lazy" decoding="async" /></span>
      <span class="copo__nome linha"><span data-revela>Grenadine</span></span>
      <span class="copo__estilo linha"><span data-revela>Intensidade, cor e presença</span></span>
    </button>
    <button class="copo" type="button" aria-pressed="false">
      <span class="copo__foto"><img src="/img/copo-dourada.webp" alt="Copo de chopp dourado com a logo da Máfia do Lúpulo" width="600" height="800" loading="lazy" decoding="async" /></span>
      <span class="copo__nome linha"><span data-revela>Dourada</span></span>
      <span class="copo__estilo linha"><span data-revela>Mais corpo, cor de ouro</span></span>
    </button>
  </div>

  <div class="copos__pe">
    <p class="copos__nota linhas">
      <span class="linha"><span data-revela>O cardápio gira com a produção.</span></span>
      <span class="linha"><span data-revela>Pergunte no balcão o que saiu do tanque.</span></span>
    </p>
    <a class="botao" href="https://app.meulink.bio.br/MafiadoLupolo" target="_blank" rel="noopener" data-revela-botao><i aria-hidden="true"></i><span>Ver o menu</span></a>
  </div>
</section>
