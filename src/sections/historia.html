<!-- a casa: uma frase grande que acende linha a linha e a foto do corredor (quadros da Lei Seca e os tanques) -->
<section class="historia" id="historia" aria-label="A casa">
  <div class="historia__frase" data-revela-grupo data-acende>
    <p class="historia__sobre linha"><span data-revela>How beer should be</span></p>
    <p class="linhas">
      <span class="linha"><span data-revela>Aqui a cerveja é feita</span></span>
      <span class="linha"><span data-revela>na casa, servida no balcão</span></span>
      <span class="linha"><span data-revela>onde nasce e protegida</span></span>
      <span class="linha"><span data-revela>como segredo de família.</span></span>
      <span class="linha"><span data-revela>Pequena, discreta e</span></span>
      <span class="linha"><span data-revela>muuuito boa.</span></span>
    </p>
  </div>
  <figure class="historia__foto" data-revela-grupo>
    <div class="historia__moldura" aria-hidden="true">
      <img src="/img/historia.webp" alt="" width="960" height="540" loading="lazy" decoding="async" data-paralaxe />
    </div>
    <figcaption class="linhas">
      <span class="linha"><span data-revela>Do corredor dos tempos da Lei Seca</span></span>
      <span class="linha"><span data-revela>até a sala dos tanques.</span></span>
    </figcaption>
  </figure>
</section>
